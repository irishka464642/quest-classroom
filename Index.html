<!DOCTYPE html>
<html lang="uk"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#e8f3ff;font:15px/1.5 system-ui,Arial,sans-serif}main{max-width:940px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1,h2,h3{margin:0 0 10px}h1{font-size:26px;color:#62eaff}h2{font-size:21px}h3{font-size:17px}.card{background:#111e32;border:1px solid #29415d;border-radius:17px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #0003}.muted{color:#a6b9d3}.small{font-size:13px}label{display:block;margin:9px 0 4px}input,select,textarea{width:100%;padding:12px;border:1px solid #476080;border-radius:9px;background:#0e1728;color:white;font-size:16px;font-family:inherit}button{background:#087f9f;color:white;border:none;border-radius:9px;padding:11px 15px;font-size:14px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#243b58}button.danger{background:#aa384c}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#1a2c43;padding:14px;border-radius:11px}.stat strong{display:block;color:#58e8f3;font-size:25px}.option{width:100%;text-align:left;background:#1d3047;border:1px solid #3a5778;padding:15px}.option.selected{border-color:#52e2ed;background:#174a61}.notice{background:#1c304b;border-left:4px solid #55ddf0;border-radius:9px;padding:12px;margin:12px 0}.alert{background:#3e1725;border:1px solid #e45572}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #30435a;padding:10px;text-align:left;white-space:nowrap}.qr{background:white;padding:7px;max-width:220px;width:100%}.tag{border-radius:20px;background:#243e58;padding:5px 12px}.error{color:#ff9fa5}.success{color:#85f5c2}#toast{position:fixed;bottom:10px;left:10px;right:10px;max-width:550px;margin:auto;background:#293b55;border-radius:10px;padding:14px;display:none;z-index:20}details{padding:7px;border-bottom:1px solid #30435a}.meter{background:#2c4057;border-radius:10px;height:9px;overflow:hidden}.meter div{height:100%;background:#39d6db}.center{text-align:center}.role{font-size:28px;color:#6de3fb}a{color:#88e9ff}#busy{color:#80dce7}
</style></head><body><main><header><h1>⬡ Quest Classroom</h1><span id="busy" class="small"></span></header><div id="app">Завантаження...</div></main><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);let sid="",pin="",token="",mode="",timer=null,last=null,choice=-1,lastStage=-1,lastStep=-1,draft="",evidenceDraft={device:"",purpose:"",specs:"",source:""},loading=false,siteUrl=localStorage.getItem("qc_deployment_url")||"";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s,err=false){const el=$("toast");el.textContent=s;el.style.display="block";el.style.background=err?"#803346":"#294c5a";setTimeout(()=>el.style.display="none",12000)}
function call(method,...args){$("busy").textContent="Синхронізація…";return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{$("busy").textContent="";resolve(r)}).withFailureHandler(e=>{$("busy").textContent="";reject(Error(e.message||String(e)))} )[method](...args))}
async function action(f){if(loading)return;loading=true;try{await f()}catch(e){toast(e.message,true)}finally{loading=false}}
function validDeployment(v){try{const u=new URL(v);return u.protocol==="https:"&&u.hostname==="script.google.com"&&/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname)}catch(_){return false}}
function share(){return validDeployment(siteUrl)?(siteUrl+"?s="+encodeURIComponent(sid)):""}
function saveDeployment(){const value=$("deploymentUrl").value.trim().split("?")[0].replace(/\/$/,"");if(!validDeployment(value)){toast("Вставте адресу розгортання script.google.com/macros/s/.../exec",true);return}siteUrl=value;localStorage.setItem("qc_deployment_url",value);drawTeacher(last);toast("Посилання збережене. Тепер можна користуватися QR-кодом.")}
function loop(){clearTimeout(timer);timer=setTimeout(()=>{if(mode==="teacher")teacher().catch(e=>toast(e.message,true));if(mode==="student")student().catch(e=>toast(e.message,true))},12000)}
function home(){$("app").innerHTML='<div class="card"><h2>Нова ігрова сесія</h2><label>Файл завдань (.json)</label><input id="bankFile" type="file" accept=".json,application/json"><label>Кількість команд</label><input id="count" type="number" min="1" max="20" value="5"><p class="muted">Один телефон від команди. Представник введе назву та прізвища всіх учасників.</p><label>PIN учителя (4–8 цифр)</label><input id="pin" type="password" inputmode="numeric"><button onclick="action(create)">Створити сесію</button></div>'}
async function create(){const file=$("bankFile").files[0];if(!file)throw Error("Оберіть файл завдань");if(file.size>500000)throw Error("Файл завеликий");let bank;try{bank=JSON.parse(await file.text())}catch(e){throw Error("Файл має містити коректний JSON")}pin=$("pin").value;const r=await call("createSession",Number($("count").value),bank,pin);sid=r.id;sessionStorage.setItem("qc_pin_"+sid,pin);mode="teacher";await teacher()}
function teacherLogin(){$("app").innerHTML='<div class="card"><h2>Панель учителя</h2><label>PIN сесії</label><input id="teacherPin" type="password" inputmode="numeric"><button onclick="action(login)">Увійти</button><button class="secondary" onclick="join()">Назад</button></div>'}
async function login(){pin=$("teacherPin").value;await call("teacherState",sid,pin);sessionStorage.setItem("qc_pin_"+sid,pin);mode="teacher";await teacher()}
async function teacher(){const s=await call("teacherState",sid,pin);last=s;if(loading||!["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))drawTeacher(s);if(s.status!=="finished")loop()}
function drawTeacher(s){const joined=s.teams.filter(t=>t.registered).length,link=share();$("app").innerHTML=
 '<div class="card"><h2>'+esc(s.title)+'</h2><p>Статус: '+esc(s.status)+' · зареєстровано '+joined+' / '+s.teams.length+' команд</p></div>'+
 (s.status==="lobby"?'<div class="card"><h3>Вхід команд</h3><label>Адреса вебдодатка /exec</label><input id="deploymentUrl" value="'+esc(siteUrl)+'"><button onclick="saveDeployment()">Зберегти адресу</button>'+(link?'<p><img class="qr" alt="QR для команд" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(link)+'"></p><input readonly onclick="this.select()" value="'+esc(link)+'"><p class="muted small">QR-сервіс отримує лише посилання на гру.</p>':'')+'<p>Один учень від кожної команди сканує QR, обирає вільний номер, вводить назву й прізвища учасників.</p><button '+(joined!==s.teams.length?'disabled':'')+' onclick="action(start)">Почати гру</button></div>':'')+
 '<div class="card"><h3>Результати й склад команд</h3><button onclick="action(exportXlsx)">Завантажити Excel (.xlsx)</button><div class="scroll"><table><thead><tr><th>Команда</th><th>Прізвища учасників</th><th>Місії</th><th>Бали</th><th>Стан</th></tr></thead><tbody>'+[...s.teams].sort((a,b)=>b.score-a.score).map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+t.members.map(esc).join('<br>')+'</td><td>'+t.stage+'/'+s.total+'</td><td>'+t.score+'</td><td>'+(t.registered?(t.pending?'На перевірці':'Зареєстровано'):'Очікуємо')+'</td></tr>').join('')+'</tbody></table></div><details><summary>Коди відновлення доступу</summary>'+s.teams.filter(t=>t.registered).map(t=>'<p>'+esc(t.name)+': <code>'+esc(t.recovery)+'</code></p>').join('')+'</details></div>'+
 (s.status==="running"?'<div class="card"><h3>Відповіді на перевірку</h3>'+s.teams.filter(t=>t.pending).map(t=>'<div class="notice"><h3>'+esc(t.name)+'</h3><p>'+esc(t.pending.title)+'</p><p>'+esc(t.pending.evidence)+'</p><p>'+esc(t.pending.answer)+'</p><label>Бали 0–100</label><input id="pts_'+t.id+'" type="number" min="0" max="100" value="100"><button onclick="action(()=>review(\''+t.id+'\',true))">Підтвердити</button><button class="secondary" onclick="action(()=>review(\''+t.id+'\',false))">Доопрацювати</button></div>').join('')+'</div>':'')+
 (['running','paused'].includes(s.status)?'<div class="card"><button onclick="action(()=>control(\''+(s.status==='paused'?'resume':'pause')+'\'))">'+(s.status==='paused'?'Продовжити':'Пауза')+'</button><button class="danger" onclick="if(confirm(\'Завершити гру?\'))action(()=>control(\'finish\'))">Завершити</button>'+s.teams.filter(t=>t.registered).map(t=>'<p>'+esc(t.name)+' <button onclick="action(()=>adjust(\''+t.id+'\',10))">+10</button><button onclick="action(()=>adjust(\''+t.id+'\',-10))">−10</button></p>').join('')+'</div>':'')+
 (s.status==='finished'?'<div class="card"><h2>Гру завершено</h2><button class="danger" onclick="action(deleteSession)">Видалити сесію та відповіді</button></div>':'')}
async function start(){await call("teacherStart",sid,pin);await teacher()}
async function review(t,ok){await call("teacherReview",sid,pin,t,ok?Number($("pts_"+t).value):0,ok);await teacher()}
async function adjust(t,n){await call("teacherAdjust",sid,pin,t,n);await teacher()}
async function unlock(t){await call("teacherUnlock",sid,pin,t);await teacher()}
async function control(v){await call("teacherControl",sid,pin,v);await teacher()}
async function deleteSession(){if(!confirm("Видалити сесію та всі відповіді?"))return;await call("teacherDelete",sid,pin);clearTimeout(timer);mode="";home()}
async function exportXlsx(){const r=await call("teacherExportXlsx",sid,pin),bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})),a=document.createElement("a");a.href=url;a.download=r.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function join(){const s=await call("publicState",sid);mode="join";$("app").innerHTML='<div class="card"><h2>'+esc(s.title)+'</h2><p>Реєстрація з одного телефона на всю команду.</p><label>Вільний номер команди</label><select id="team">'+s.teams.filter(t=>!t.registered).map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('')+'</select><label>Назва команди</label><input id="teamName" maxlength="40"><label>Прізвища всіх учасників — кожне з нового рядка</label><textarea id="surnames" rows="6" maxlength="2000" placeholder="Шевченко&#10;Коваль&#10;Бондар"></textarea><button '+(s.status!=='lobby'||s.teams.every(t=>t.registered)?'disabled':'')+' onclick="action(register)">Зареєструвати команду</button><button class="secondary" onclick="action(join)">Оновити список</button><button class="secondary" onclick="teacherLogin()">Я вчитель</button></div><div class="card"><h3>Відновити доступ команди</h3><select id="recoverTeam">'+s.teams.filter(t=>t.registered).map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('')+'</select><label>Код відновлення</label><input id="recoveryCode" maxlength="12"><button onclick="action(recover)">Відновити</button></div>'}
async function register(){const r=await call("registerTeam",sid,$("team").value,$("teamName").value,$("surnames").value);token=r.token;localStorage.setItem("qc_token_"+sid,token);mode="student";await student()}
async function recover(){const r=await call("recoverTeam",sid,$("recoverTeam").value,$("recoveryCode").value);token=r.token;localStorage.setItem("qc_token_"+sid,token);mode="student";await student()}
async function student(){
 const s=await call("studentState",sid,token);
 if(s.stage!==lastStage||s.step!==lastStep){choice=-1;draft="";evidenceDraft={device:"",purpose:"",specs:"",source:""};lastStage=s.stage;lastStep=s.step}
 last=s;
 if(document.activeElement&&(document.activeElement.id==="written"||document.activeElement.id.startsWith("e_"))&&s.status==="running"&&!s.pending&&!s.lockSeconds){loop();return}
 drawStudent(s);
 if(s.status==="finished"||s.completed)clearTimeout(timer);else loop();
}
function drawStudent(s){
 if(s.status==="lobby"){$("app").innerHTML='<div class="card center"><h2>Команду зареєстровано!</h2><p>'+esc(s.team)+'</p><p class="muted">Очікуємо, поки вчитель почне гру.</p><p>Код відновлення: <b>'+esc(s.recovery)+'</b></p></div>';return}
 if(s.status==="paused"){$("app").innerHTML='<div class="card center"><h2>⏸ Пауза</h2><p>Учитель призупинив гру.</p></div>';return}
 if(s.status==="finished"||s.completed){$("app").innerHTML='<div class="card center"><h2>🏆 Гру завершено</h2><p>'+esc(s.team)+' — '+s.score+' балів</p></div>';return}
 const step=s.step||0,mission=s.mission,stepTitle=["Збір доказів","Діагностика","Захист рішення"][step];
 $("app").innerHTML='<div class="card"><div class="row between"><h2>'+esc(s.team)+'</h2><span class="tag">Місія '+(s.stage+1)+'/'+s.total+' · '+(step+1)+'/3</span></div><p class="muted">Командна відповідь · '+s.score+' балів</p></div>'+
 (s.lockSeconds?'<div class="card alert center"><h2>🔒 Штрафне блокування</h2><h1>00:'+String(s.lockSeconds).padStart(2,"0")+'</h1><p>Протягом штрафу не можна надсилати відповіді.</p></div>':"")+
 (s.pending?'<div class="card"><h2>⏳ Очікуємо перевірки</h2><p>Учитель аналізує обґрунтування команди.</p></div>':
 '<div class="card"><h3>Досьє команди</h3><div class="notice">'+esc(s.info)+'</div><h2>'+esc(mission.title)+' — '+stepTitle+'</h2><p class="muted">'+(step===0?'ЗАРАЗ: досліджуйте проблему й заповніть чотири поля. Варіанти відповіді з’являться на наступному етапі.':step===1?'ЗАРАЗ: оберіть рішення, спираючись на зібрані докази.':'ЗАРАЗ: обґрунтуйте рішення команди.')+'</p><div class="notice"><b>Ситуація:</b> '+esc(mission.prompt)+'</div>'+
 (step===0?'<p><b>Пошукове завдання команди:</b> '+esc(mission.research)+'</p><p class="muted">Обговоріть знахідки разом. Представник команди заповнює чотири короткі поля про цей конкретний кейс.</p>'+
 '<label>1. Який об’єкт, подію або поняття дослідили?</label><input id="e_device" maxlength="120" oninput="saveEvidence()" placeholder="Назва об’єкта дослідження">'+
 '<label>2. Для чого це потрібно саме в нашому кейсі?</label><textarea id="e_purpose" rows="2" maxlength="240" oninput="saveEvidence()" placeholder="Призначення та зв’язок із ситуацією"></textarea>'+
 '<label>3. Які два факти або характеристики підтверджують ваш вибір?</label><textarea id="e_specs" rows="3" maxlength="350" oninput="saveEvidence()" placeholder="Два факти, докази або характеристики"></textarea>'+
 '<label>4. Звідки взяли інформацію?</label><input id="e_source" maxlength="300" oninput="saveEvidence()" placeholder="Автор, сторінка, підручник або посилання">':
 step===1?'<p class="muted">Обговоріть усі варіанти разом. Оберіть обґрунтоване рішення.</p>'+mission.options.map((o,i)=>'<button class="option '+(choice===i?"selected":"")+'" onclick="selectOpt('+i+')">'+(i+1)+'. '+esc(o)+'</button>').join(""):
 '<h3>Аргументуйте вибір</h3><p>'+esc(mission.justify)+'</p><p class="muted">Не менш ніж 95 символів. Наведіть конкретні докази та поясніть висновок. '+(mission.review?"Цю відповідь оцінить учитель.":"Цю відповідь буде збережено без автоматичної оцінки змісту.")+'</p><textarea id="written" rows="7" maxlength="1200" oninput="saveDraft(this.value)" placeholder="Рекомендація, аргументи, обмеження...">'+esc(draft)+'</textarea>')+
 '<button '+(s.lockSeconds||(step===1&&choice<0)?"disabled":"")+' onclick="action(sendAnswer)">'+(step===0?"Завершити дослідження":step===1?"Перевірити рішення":mission.review?"Передати вчителю":"Зберегти захист і продовжити")+'</button></div>');
}
function selectOpt(i){choice=i;document.querySelectorAll(".option").forEach((el,j)=>el.classList.toggle("selected",j===i));const b=document.querySelector('button[onclick*="sendAnswer"],button[onclick*="sendEmergency"]');if(b&&!last.lockSeconds)b.disabled=false}
function saveDraft(value){draft=value}
function saveEvidence(){for(const key of ["device","purpose","specs","source"]){const el=$("e_"+key);if(el)evidenceDraft[key]=el.value}}
async function sendAnswer(){const step=last.step||0;const value=step===0?(saveEvidence(),evidenceDraft):step===1?choice:($("written")?.value||"");const r=await call("answerMission",sid,token,value,last.stage,last.step||0);choice=-1;draft="";evidenceDraft={device:"",purpose:"",specs:"",source:""};toast(r.message,r.correct===false);await student()}
(async()=>{try{
 const entry=await new Promise(resolve=>{
  if(typeof google==="undefined"||!google.script||!google.script.url){resolve({});return}
  google.script.url.getLocation(loc=>resolve((loc&&loc.parameter)||{}))
 });
 sid=String(entry.s||"");
 if(!sid){home();return}
 token=localStorage.getItem("qc_token_"+sid)||"";
 pin=sessionStorage.getItem("qc_pin_"+sid)||"";
 if(pin){mode="teacher";await teacher()}else if(token){mode="student";await student()}else await join()
 }catch(e){$("app").innerHTML='<div class="card"><h2>Помилка запуску</h2><p class="error">'+esc(e.message)+'</p><button onclick="location.reload()">Повторити</button></div>';toast(e.message,true)}})();
</script></body></html>
