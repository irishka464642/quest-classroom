<!DOCTYPE html>
<html lang="uk"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#e8f3ff;font:15px/1.5 system-ui,Arial,sans-serif}main{max-width:940px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1,h2,h3{margin:0 0 10px}h1{font-size:26px;color:#62eaff}h2{font-size:21px}h3{font-size:17px}.card{background:#111e32;border:1px solid #29415d;border-radius:17px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #0003}.muted{color:#a6b9d3}.small{font-size:13px}label{display:block;margin:9px 0 4px}input,select,textarea{width:100%;padding:12px;border:1px solid #476080;border-radius:9px;background:#0e1728;color:white;font-size:16px;font-family:inherit}button{background:#087f9f;color:white;border:none;border-radius:9px;padding:11px 15px;font-size:14px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#243b58}button.danger{background:#aa384c}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#1a2c43;padding:14px;border-radius:11px}.stat strong{display:block;color:#58e8f3;font-size:25px}.option{width:100%;text-align:left;background:#1d3047;border:1px solid #3a5778;padding:15px}.option.selected{border-color:#52e2ed;background:#174a61}.notice{background:#1c304b;border-left:4px solid #55ddf0;border-radius:9px;padding:12px;margin:12px 0}.alert{background:#3e1725;border:1px solid #e45572}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #30435a;padding:10px;text-align:left;white-space:nowrap}.qr{background:white;padding:7px;max-width:220px;width:100%}.tag{border-radius:20px;background:#243e58;padding:5px 12px}.error{color:#ff9fa5}.success{color:#85f5c2}#toast{position:fixed;bottom:10px;left:10px;right:10px;max-width:550px;margin:auto;background:#293b55;border-radius:10px;padding:14px;display:none;z-index:20}details{padding:7px;border-bottom:1px solid #30435a}.meter{background:#2c4057;border-radius:10px;height:9px;overflow:hidden}.meter div{height:100%;background:#39d6db}.center{text-align:center}.role{font-size:28px;color:#6de3fb}a{color:#88e9ff}#busy{color:#80dce7}
</style></head><body><main><header><h1>⬡ Quest Classroom</h1><span id="busy" class="small"></span></header><div id="app">Завантаження...</div></main><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);let sid="",pin="",token="",mode="",timer=null,last=null,answerDraft=null,correctionDraft=null,shortDraft="",multiDraft=[],matchDraft=[],orderDraft=[],lastLevel=-1,lastQuestion=-1,loading=false,siteUrl=localStorage.getItem("qc_deployment_url")||"";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s,err=false){const el=$("toast");el.textContent=s;el.style.display="block";el.style.background=err?"#803346":"#294c5a";setTimeout(()=>el.style.display="none",12000)}
function call(method,...args){$("busy").textContent="Синхронізація…";return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{$("busy").textContent="";resolve(r)}).withFailureHandler(e=>{$("busy").textContent="";reject(Error(e.message||String(e)))} )[method](...args))}
async function action(f){if(loading)return;loading=true;try{await f()}catch(e){toast(e.message,true)}finally{loading=false}}
function validDeployment(v){try{const u=new URL(v);return u.protocol==="https:"&&u.hostname==="script.google.com"&&/^\/macros\/s\/[^/]+\/exec$/.test(u.pathname)}catch(_){return false}}
function share(){return validDeployment(siteUrl)?(siteUrl+"?s="+encodeURIComponent(sid)):""}
function saveDeployment(){const value=$("deploymentUrl").value.trim().split("?")[0].replace(/\/$/,"");if(!validDeployment(value)){toast("Вставте адресу розгортання script.google.com/macros/s/.../exec",true);return}siteUrl=value;localStorage.setItem("qc_deployment_url",value);drawTeacher(last);toast("Посилання збережене. Тепер можна користуватися QR-кодом.")}
function loop(){clearTimeout(timer);timer=setTimeout(()=>{if(mode==="teacher")teacher().catch(e=>toast(e.message,true));if(mode==="student")student().catch(e=>toast(e.message,true))},12000)}
function home(){$("app").innerHTML=(localStorage.getItem("qc_teacher_session")?'<div class="card"><h2>Повернутися до сесії</h2><p class="muted">Сесію та її результати збережено. Введіть PIN, щоб відкрити панель учителя.</p><button class="secondary" onclick="action(restoreLastSession)">Відновити останню сесію</button></div>':'')+'<div class="card"><h2>Нова ігрова сесія</h2><label>Файл завдань (.json)</label><input id="bankFile" type="file" accept=".json,application/json"><p class="muted">Формат файлу описаний у questions-template.json. У ньому 6 тестів, 3 питання з кількома правильними відповідями та 3 завдання на відповідність або хронологію.</p><label>Кількість команд</label><input id="count" type="number" min="1" max="20" value="5"><p class="muted">Один телефон від команди. Представник введе назву та прізвища всіх учасників.</p><label>PIN учителя (4–8 цифр)</label><input id="pin" type="password" inputmode="numeric"><button onclick="action(create)">Створити сесію</button></div>'}
async function restoreLastSession(){sid=localStorage.getItem("qc_teacher_session")||"";if(!sid)throw Error("На цьому пристрої не збережено код сесії");await call("publicState",sid);teacherLogin()}
async function create(){const file=$("bankFile").files[0];if(!file)throw Error("Оберіть файл завдань");if(file.size>500000)throw Error("Файл завеликий");let bank;try{bank=JSON.parse(await file.text())}catch(e){throw Error("Файл має містити коректний JSON")}pin=$("pin").value;const r=await call("createSession",Number($("count").value),bank,pin);sid=r.id;localStorage.setItem("qc_teacher_session",sid);sessionStorage.setItem("qc_pin_"+sid,pin);mode="teacher";await teacher()}
function teacherLogin(){$("app").innerHTML='<div class="card"><h2>Панель учителя</h2><label>PIN сесії</label><input id="teacherPin" type="password" inputmode="numeric"><button onclick="action(login)">Увійти</button><button class="secondary" onclick="join()">Назад</button></div>'}
async function login(){pin=$("teacherPin").value;await call("teacherState",sid,pin);sessionStorage.setItem("qc_pin_"+sid,pin);mode="teacher";await teacher()}
async function teacher(){const s=await call("teacherState",sid,pin);last=s;if(loading||!["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))drawTeacher(s);if(s.status!=="finished")loop()}
function drawTeacher(s){const joined=s.teams.filter(t=>t.registered).length,link=share();$("app").innerHTML='<div class="card"><h2>'+esc(s.title)+'</h2><p>Статус: '+esc(({lobby:"реєстрація",running:"гра триває",paused:"пауза",finished:"завершено"})[s.status]||s.status)+' · зареєстровано '+joined+' / '+s.teams.length+' команд</p><p class="muted">5 рівнів · 18 питань · максимум 630 балів за правильні відповіді й бонуси</p></div>'+(s.status==="lobby"?'<div class="card"><h3>Вхід команд</h3><label>Адреса вебдодатка /exec</label><input id="deploymentUrl" value="'+esc(siteUrl)+'"><button onclick="saveDeployment()">Зберегти адресу</button>'+(link?'<p><img class="qr" alt="QR для команд" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(link)+'"></p><input readonly onclick="this.select()" value="'+esc(link)+'"><p class="muted small">QR-сервіс отримує лише посилання на гру.</p>':'')+'<p>Один учень від кожної команди сканує QR, обирає вільний номер, вводить назву й прізвища учасників.</p><button '+(joined!==s.teams.length?'disabled':'')+' onclick="action(start)">Почати гру</button></div>':'')+'<div class="card"><h3>Результати й склад команд</h3><button onclick="action(exportXlsx)">Завантажити Excel (.xlsx)</button><div class="scroll"><table><thead><tr><th>Команда</th><th>Прізвища учасників</th><th>Питання</th><th>Бали</th><th>Стан</th></tr></thead><tbody>'+[...s.teams].sort((a,b)=>b.score-a.score).map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+t.members.map(esc).join('<br>')+'</td><td>'+t.completedQuestions+'/'+s.total+'</td><td>'+t.score+'</td><td>'+(t.registered?(t.completedQuestions>=s.total?'Завершила':s.status==='finished'?'Гру завершено':'У грі'):'Очікуємо')+'</td></tr>').join('')+'</tbody></table></div><details><summary>Коди відновлення доступу</summary>'+s.teams.filter(t=>t.registered).map(t=>'<p>'+esc(t.name)+': <code>'+esc(t.recovery)+'</code></p>').join('')+'</details></div>'+(s.status==='running'||s.status==='paused'?'<div class="card"><button onclick="action(()=>control(\''+(s.status==='paused'?'resume':'pause')+'\'))">'+(s.status==='paused'?'Продовжити':'Пауза')+'</button><button class="danger" onclick="if(confirm(\'Завершити гру?\'))action(()=>control(\'finish\'))">Завершити</button>'+s.teams.filter(t=>t.registered).map(t=>'<p>'+esc(t.name)+' <button onclick="action(()=>adjust(\''+t.id+'\',10))">+10</button><button class="secondary" onclick="action(()=>adjust(\''+t.id+'\',-10))">−10</button></p>').join('')+'</div>':'')+(s.status==='finished'?'<div class="card"><h2>Гру завершено</h2><button class="danger" onclick="action(deleteSession)">Видалити сесію та відповіді</button></div>':'')}
async function start(){await call("teacherStart",sid,pin);await teacher()}
async function adjust(t,n){await call("teacherAdjust",sid,pin,t,n);await teacher()}
async function control(v){await call("teacherControl",sid,pin,v);await teacher()}
async function deleteSession(){if(!confirm("Видалити сесію та всі відповіді?"))return;await call("teacherDelete",sid,pin);if(localStorage.getItem("qc_teacher_session")===sid)localStorage.removeItem("qc_teacher_session");clearTimeout(timer);mode="";home()}
async function exportXlsx(){const r=await call("teacherExportXlsx",sid,pin),bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})),a=document.createElement("a");a.href=url;a.download=r.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function join(){const s=await call("publicState",sid);mode="join";$("app").innerHTML='<div class="card"><h2>'+esc(s.title)+'</h2><p>Реєстрація з одного телефона на всю команду.</p><label>Вільний номер команди</label><select id="team">'+s.teams.filter(t=>!t.registered).map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('')+'</select><label>Назва команди</label><input id="teamName" maxlength="40"><label>Прізвища всіх учасників — кожне з нового рядка</label><textarea id="surnames" rows="6" maxlength="2000" placeholder="Шевченко&#10;Коваль&#10;Бондар"></textarea><button '+(s.status!=='lobby'||s.teams.every(t=>t.registered)?'disabled':'')+' onclick="action(register)">Зареєструвати команду</button><button class="secondary" onclick="action(join)">Оновити список</button><button class="secondary" onclick="teacherLogin()">Я вчитель</button></div><div class="card"><h3>Відновити доступ команди</h3><select id="recoverTeam">'+s.teams.filter(t=>t.registered).map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('')+'</select><label>Код відновлення — 6 цифр</label><input id="recoveryCode" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="Наприклад, 042681"><button onclick="action(recover)">Відновити</button></div>'}
async function register(){const r=await call("registerTeam",sid,$("team").value,$("teamName").value,$("surnames").value);token=r.token;localStorage.setItem("qc_token_"+sid,token);mode="student";await student()}
async function recover(){const r=await call("recoverTeam",sid,$("recoverTeam").value,$("recoveryCode").value);token=r.token;localStorage.setItem("qc_token_"+sid,token);mode="student";await student()}
function resetDrafts(){answerDraft=null;correctionDraft=null;shortDraft="";multiDraft=[];matchDraft=[];orderDraft=[]}
async function student(){const s=await call("studentState",sid,token);if(s.level!==lastLevel||s.questionIndex!==lastQuestion){resetDrafts();lastLevel=s.level;lastQuestion=s.questionIndex}last=s;if(document.activeElement&&["SELECT","INPUT","TEXTAREA"].includes(document.activeElement.tagName)&&s.status==="running"){loop();return}drawStudent(s);if(s.status==="finished"||s.completed)clearTimeout(timer);else loop()}
function drawFinished(s){const key=s.answerKey||[];$("app").innerHTML='<div class="card center"><h2>🏆 Гру завершено</h2><p>'+esc(s.team)+' — '+s.score+' балів</p><p class="muted">Питань опрацьовано: '+s.completedQuestions+'/'+s.totalQuestions+'</p></div>'+(key.length?'<div class="card"><h2>Правильні відповіді</h2><p class="muted">Ключ відкрився після завершення гри.</p>'+key.map((level,li)=>'<details><summary>Рівень '+(li+1)+': '+esc(level.title)+'</summary>'+level.questions.map((q,qi)=>'<div class="notice"><b>'+ (qi+1)+'. '+esc(q.prompt)+'</b><p class="success">'+esc(q.answer).replace(/\n/g,'<br>')+'</p></div>').join('')+'</details>').join('')+'</div>':'')}
function drawStudent(s){if(s.status==="lobby"){$("app").innerHTML='<div class="card center"><h2>Команду зареєстровано!</h2><p>'+esc(s.team)+'</p><p class="muted">Очікуємо, поки вчитель почне гру.</p><p>Код відновлення: <b>'+esc(s.recovery)+'</b></p></div>';return}if(s.status==="paused"){$("app").innerHTML='<div class="card center"><h2>⏸ Пауза</h2><p>Учитель призупинив гру.</p><p>'+esc(s.team)+' · '+s.score+' балів</p></div>';return}if(s.status==="finished"||s.completed){drawFinished(s);return}const q=s.question;let controls="";if(q.type==="single"||q.type==="spotError")controls=(q.type==="spotError"?'<p class="muted">Оберіть твердження, у якому є помилка.</p>':'')+q.options.map((o,i)=>'<button class="option '+(answerDraft===i?'selected':'')+'" onclick="selectSingle('+i+')">'+(i+1)+'. '+esc(o)+'</button>').join('')+(q.type==="spotError"&&answerDraft!==null?'<label>Як виправити це твердження?</label><select onchange="correctionDraft=this.value===\'\'?null:Number(this.value)"><option value="">Оберіть виправлення</option>'+q.corrections.map((v,i)=>'<option value="'+i+'" '+(correctionDraft===i?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':'');else if(q.type==="multiple")controls='<p class="muted">Оберіть усі правильні варіанти.</p>'+q.options.map((o,i)=>'<button class="option '+(multiDraft.includes(i)?'selected':'')+'" onclick="toggleMultiple('+i+')">'+(multiDraft.includes(i)?'☑':'☐')+' '+esc(o)+'</button>').join('');else if(q.type==="shortAnswer")controls='<label>Коротка відповідь</label><input id="shortAnswer" maxlength="300" value="'+esc(shortDraft)+'" oninput="shortDraft=this.value" placeholder="Введіть термін, дату або відповідь">';else if(q.type==="matching")controls='<p class="muted">Для кожного елемента зліва оберіть відповідний елемент справа.</p>'+q.left.map((v,i)=>'<label>'+esc(v)+'</label><select onchange="matchDraft['+i+']=this.value===\'\'?null:Number(this.value)"><option value="">Оберіть відповідь</option>'+q.right.map((r,j)=>'<option value="'+j+'" '+(matchDraft[i]===j?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select>').join('');else controls='<p class="muted">Розташуйте елементи в правильній послідовності.</p>'+q.items.map((v,i)=>'<label>'+esc(v)+'</label><select onchange="orderDraft['+i+']=this.value===\'\'?null:Number(this.value)"><option value="">Місце в послідовності</option>'+q.items.map((_,j)=>'<option value="'+j+'" '+(orderDraft[i]===j?'selected':'')+'>'+(j+1)+'</option>').join('')+'</select>').join('');$("app").innerHTML='<div class="card"><div class="row between"><h2>'+esc(s.team)+'</h2><span class="tag">Рівень '+(s.level+1)+'/5 · питання '+s.levelQuestion+'/'+s.levelTotal+'</span></div><p class="muted">'+s.completedQuestions+'/'+s.totalQuestions+' питань · '+s.score+' балів</p><div class="meter"><div style="width:'+Math.round(100*s.completedQuestions/s.totalQuestions)+'%"></div></div></div><div class="card"><p class="muted">'+esc(s.levelTitle)+' · за правильну відповідь: '+s.pointsPerQuestion+' балів · одна спроба</p><h2>'+esc(q.prompt)+'</h2>'+controls+'<button onclick="action(sendAnswer)" '+((q.type==='single'&&answerDraft===null)||(q.type==='spotError'&&(answerDraft===null||correctionDraft===null))?'disabled':'')+'>Перевірити відповідь</button></div>'}
function selectSingle(i){answerDraft=i;if(last.question.type==="spotError")correctionDraft=null;drawStudent(last)}function toggleMultiple(i){multiDraft=multiDraft.includes(i)?multiDraft.filter(v=>v!==i):[...multiDraft,i];drawStudent(last)}
async function sendAnswer(){const q=last.question;let answer;if(q.type==="single"||q.type==="spotError"){if(answerDraft===null)throw Error("Оберіть відповідь");answer=q.type==="spotError"?{errorIndex:answerDraft,correctionIndex:correctionDraft}:answerDraft}else if(q.type==="shortAnswer"){answer=shortDraft;if(!shortDraft.trim())throw Error("Впишіть коротку відповідь")}else if(q.type==="multiple"){if(!multiDraft.length)throw Error("Оберіть варіанти відповіді");answer=multiDraft.slice()}else if(q.type==="matching"){if(matchDraft.length!==q.left.length||Array.from({length:q.left.length},(_,i)=>matchDraft[i]).some(v=>!Number.isInteger(v)))throw Error("Заповніть усі відповідності");answer=matchDraft.slice()}else if(q.type==="ordering"){if(orderDraft.length!==q.items.length||Array.from({length:q.items.length},(_,i)=>orderDraft[i]).some(v=>!Number.isInteger(v))||new Set(orderDraft).size!==orderDraft.length)throw Error("Розставте всі елементи на різні місця");answer=orderDraft.map((_,i)=>i).sort((a,b)=>orderDraft[a]-orderDraft[b])}const r=await call("answerQuestion",sid,token,answer,last.level,last.questionIndex);if(r.correct)resetDrafts();toast(r.message,r.correct===false);await student()}
(async()=>{try{const entry=await new Promise(resolve=>{if(typeof google==="undefined"||!google.script||!google.script.url){resolve({});return}google.script.url.getLocation(loc=>resolve((loc&&loc.parameter)||{}))});sid=String(entry.s||"");if(!sid){home();return}token=localStorage.getItem("qc_token_"+sid)||"";pin=sessionStorage.getItem("qc_pin_"+sid)||"";if(pin){mode="teacher";await teacher()}else if(token){mode="student";await student()}else await join()}catch(e){$("app").innerHTML='<div class="card"><h2>Помилка запуску</h2><p class="error">'+esc(e.message)+'</p><button onclick="location.reload()">Повторити</button></div>';toast(e.message,true)}})();

</script></body></html>
